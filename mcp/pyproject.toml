[project]
name = "trip-mcp"
version = "0.1.0"
description = "MCP server for the Trip application"
dependencies = [
    "mcp[cli]>=0.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
